spring.application.name=silent-campaign-manager

# Use PostgreSQL by default. If the database is not running locally,
# start it with `docker compose up -d` or override these values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/silent_campaign_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

spring.jpa.open-in-view=false

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

jwt.secret=${JWT_SECRET:mySuperSecretKeyForSilentCampaignManager2026!!SCM}
jwt.expiration=${JWT_EXPIRATION:86400000}